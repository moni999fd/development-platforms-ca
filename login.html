<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | News Platform</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>

  <body>
  <header class="navbar">
    <nav class="nav">
      <div class="nav-left">
        <a id="navHome" href="./index.html">Home</a>
        <a id="navCreate" href="./create-article.html" class="hidden">
          Create Article
        </a>
      </div>

      <div class="nav-right">
        <a id="navLogin" href="./login.html">Login</a>
        <a id="navRegister" href="./register.html">Register</a>

        <span id="navUser" class="pill hidden"></span>
        <button id="navLogout" class="btn hidden" type="button">
          Logout
        </button>
      </div>
    </nav>
  </header>

    <main class="container">
      <h1>Login</h1>

      <form id="loginForm" class="card">
        <label>
          Email
          <input id="email" type="email" required placeholder="name@stud.noroff.no" />
        </label>

        <label>
          Password
          <input id="password" type="password" required minlength="6" />
        </label>

        <button type="submit" class="btn">Login</button>

        <p id="message" class="message" aria-live="polite"></p>
      </form>
    </main>

    <script type="module" src="./js/auth.js"></script>
    <script type="module" src="./js/login.js"></script>
    <footer class="footer">

  © 2026 News Platform
</footer>
  </body>
</html>
